name: Local adaptation proposal
description: Propose using ROUTE for a bounded state, corridor, port, region, terminal, or freight-network question.
title: "Local adaptation: "
labels: ["adoption", "evidence-needed"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for a bounded ROUTE adaptation. Public reuse does not create an official-plan, endorsement, construction, ROI, guaranteed-SLA, funding, compliance, procurement, or validation claim.
  - type: input
    id: scope
    attributes:
      label: Bounded scope
      description: Name the state, corridor, port, region, terminal district, or freight network.
      placeholder: "Example: I-80 freight resilience across northern Nevada"
    validations:
      required: true
  - type: textarea
    id: service-question
    attributes:
      label: Service question
      description: What should this network promise, and what breaks that promise?
      placeholder: "Example: Which alternate paths keep port-to-inland service credible during a weather closure?"
    validations:
      required: true
  - type: textarea
    id: source-surfaces
    attributes:
      label: Existing source surfaces
      description: List known GIS, traffic, asset, incident, freight, port, toll, safety, planning, or local-knowledge sources.
    validations:
      required: true
  - type: textarea
    id: candidate-roles
    attributes:
      label: Candidate roles
      description: Draft any T1/T2/T3/T4, resilience, maintenance-only, or non-promotion roles you expect.
      placeholder: "T1 spine, T2 connector, T3 rural access, T4 terminal access, R resilience alternate, M maintenance-only, X non-promotion."
  - type: textarea
    id: held-claims
    attributes:
      label: Claims that must stay held
      description: Name official, endorsement, SLA, construction, ROI, funding, compliance, procurement, or validation claims that should not be made.
    validations:
      required: true
  - type: dropdown
    id: contribution-type
    attributes:
      label: Expected contribution
      options:
        - Source inventory
        - Diagnostic fixture
        - Map or schematic fixture
        - Role-review note
        - Research review
        - Public-language correction
        - Other bounded adaptation
    validations:
      required: true
