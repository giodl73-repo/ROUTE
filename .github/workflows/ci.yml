name: ROUTE CI

on:
  push:
  pull_request:

jobs:
  flagship-quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint flagship crates
        run: cargo clippy --locked -p route-score -p route-report --all-targets --no-deps -- -D warnings

      - name: Test flagship crates
        run: cargo test -q --locked -p route-score -p route-report

      - name: Check I-80 packet
        run: npm run check:i80:packet

      - name: Test I-80 source orchestration
        run: npm run test:i80:sources

      - name: Test I-80 report reproduction
        run: npm run test:i80:reproduction

      - name: Generate I-80 source readiness
        run: npm run check:i80:sources

  test-and-release-gates:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Milepost release gates
        shell: pwsh
        run: ./scripts/check-mileposts.ps1
