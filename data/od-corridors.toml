# O-D Corridor definitions for route od and route interventions commands.
# Each corridor is a named list of segments with traffic and incident parameters.
#
# Segment fields:
#   name:                    human-readable label
#   miles:                   segment length (miles)
#   base_vc:                 baseline V/C ratio (HPMS AADT / design capacity)
#   free_flow_mph:           posted/design speed (mph)
#   incident_prob:           probability a given trip experiences a major incident here
#   incident_delay_mean_h:   mean delay when incident occurs (hours, lognormal)
#   incident_delay_std_h:    std dev of delay (hours)
#   managed_lane_bypasses:   if true, managed lane avoids incident (e.g. Donner tunnel)
#   managed_lane_vc:         V/C on managed freight lanes (target: 0.70)
#
# Sources: HPMS 2018; Caltrans District 3 closure logs; FHWA incident database;
#          ATRI bottleneck report 2024; WSDOT closure data

# ── Freight corridors ─────────────────────────────────────────────────────────

[corridor.ny_la]
name = "NY→LA (I-80 Northern Transcontinental)"
origin = "New York City, NY"
destination = "Los Angeles, CA"
fixed_overhead_hours = 4.0   # fueling (3 stops × 45min) + inspection + loading
hos_driving_hours = 11.0
hos_rest_hours = 10.0

[[corridor.ny_la.segments]]
name = "NJ/PA urban (I-95→I-78→I-80)"
miles = 120.0
base_vc = 0.92
free_flow_mph = 65.0
incident_prob = 0.18
incident_delay_mean_h = 1.2
incident_delay_std_h = 0.8
managed_lane_bypasses = false
managed_lane_vc = 0.70

