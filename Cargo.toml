[workspace]
members = [
    "crates/route-data",
    "crates/route-network",
    "crates/route-score",
    "crates/route-map",
    "crates/route-report",
    "crates/route-sim",
    "crates/route-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gio Della-Libera"]
license = "MIT"

[workspace.dependencies]
# Geometry
shapefile  = "0.6"
geo        = "0.28"
geo-types  = "0.7"
rstar      = "0.12"

# Graph analysis
petgraph      = "0.6"
ordered-float = "4"

# Optimization
minilp        = "0.2"   # pure Rust LP solver — investment allocation, multi-constraint portfolio

# Simulation
rand          = "0.8"   # reproducible RNG for chaos Monte Carlo

# Graph partitioning (deferred — add to route-network when gap analysis phase begins)
metis-core = { git = "https://github.com/giodl73-repo/METIS-CORE.git", rev = "78ae34090e043e79a206f2daffaa3889389b4790" }
# Local development overrides are generated from repo-map.toml into .cargo/config.toml.

# Data handling
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
csv        = "1"
zip        = "2"
toml       = "0.8"

# CLI
clap       = { version = "4", features = ["derive"] }

# Rendering
resvg      = "0.47"
tiny-skia  = "0.11"

# Utilities
rayon      = "1.10"
thiserror  = "2"
anyhow     = "1"
reqwest    = { version = "0.12", features = ["blocking"] }
