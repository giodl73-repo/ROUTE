# ROUTE Scoring Anchors — config/scoring.toml
#
# Runtime-configurable scoring anchors for all 12 dimensions.
# Edit this file and re-run `route score` to update scores without recompiling.
# Three-point linear interpolation: anchor_0 → score 0, anchor_5 → score 5, anchor_10 → score 10.
# Values above anchor_10 are clamped to 10.0.
#
# Update this file after each calibration pass (route calibrate) if anchors need rescaling.
# Bump [meta].version when anchors change; prior corpus entries record the version they were scored under.

[meta]
version = "v1.3"
rubric_version = "v1.3"

# v1.3 changes (2026-05-07):
#   D1: ECH100 normalization — both SFHA flood mileage and winter closure-hours
#       converted to the same unit before scoring:
#       ECH100 = expected annual lane-closure-hours per 100 miles of corridor
#       Flood:   ECH100_flood  = (consecutive_sfha_mi × p_flood × mean_duration_hr) / (L/100)
#                × structural_multiplier μ=5.0 (flood requires weeks of repair vs. hours)
#       Winter:  ECH100_winter = (closures_per_yr × mean_duration_hr) / (L/100)
#                × recovery_discount δ=0.78 (winter closures are recoverable within days)
#       Unified D1 anchor: ECH100=0→0, ECH100=50 hr/100mi→5, ECH100≥200→10
#       All v1.2 D1 scores preserved — ECH100 recovers same values for all 227 corridors
#       Forward-only protocol: v1.2 corpus entries tagged; v1.3 scored separately
#
# v1.2 changes (2026-05-07):
#   A3: BPR-estimated PTI added as primary path when V/C computable from HPMS
#       PTI_bpr = 1 + 0.15 × (V/C_peak × 1.15)^4; V/C_peak = p90_aadt × 0.09 / (lanes/2 × 2300)
#       This replaces IRI as the primary fallback; IRI cap at 5.0 remains as last resort
#   A4: International Trade Corridor (NEW) — USMCA freight flow potential, 0-10
#   B4: Military/Strategic Designation (NEW) — STRAHNET + military base proximity, 0-10
#   C4: Agricultural Export Access (NEW) — grain belt + export terminal proximity, 0-10
#   Score range: 150 (was 120). Tier thresholds scaled proportionally:
#     v1.2: T1>=26, T2>=19, T3>=11, T4<11
#
# v1.1 changes (preserved for reference):
#   A3: IRI fallback cap added — iri_fallback_max = 5.0
#   TIER THRESHOLDS: T1>=21, T2>=15, T3>=9 (now superseded by v1.2)
#     v1.1: T1>=21, T2>=15, T3>=9,  T4<9  (preserves T1=13, T2=28, T3=60, T4=126)

# ── Band A: Flow ──────────────────────────────────────────────────────────────

[a1]
# Throughput Gap — 90th-percentile segment AADT
# Low score = well below capacity (free-flow). High score = chronic congestion.
anchor_0  = 5_000      # rural free-flow; well under capacity
anchor_5  = 50_000     # moderate urban; approaching capacity in peaks
anchor_10 = 150_000    # chronic LOS E/F; major bottleneck corridor

[a2]
# Freight Intensity — annual freight value in $B (FAF5 zone-traversal estimate)
# Low = minimal freight. High = top-tier national freight corridor.
anchor_0  = 2.0        # negligible commodity flow
anchor_5  = 40.0       # significant regional freight
anchor_10 = 200.0      # top-tier national corridor (comparable to I-10 at Laredo)

[a3]
# Speed Reliability — Planning Time Index (95th-pct travel time / free-flow travel time)
# PTI = 1.0 means perfectly reliable. PTI = 2.0 means 95th-pct trip takes twice free-flow.
# PRIMARY source: FHWA Freight Performance Measures (PTI data by corridor)
# FALLBACK: IRI proxy — capped at iri_fallback_max (v1.1 amendment: was unbounded,
#   caused I-80 to score 10.0 with no PTI data; IRI is pavement roughness not speed reliability)
anchor_0  = 1.05       # highly reliable; near free-flow at 95th percentile
anchor_5  = 1.40       # moderate unreliability; freight scheduling impact
anchor_10 = 2.20       # severe unreliability; JIT supply chains disrupted
iri_fallback_max = 5.0 # v1.1: IRI fallback capped — "moderate unreliable" floor when no PTI

# ── Band B: Network ───────────────────────────────────────────────────────────

[b1]
# Redundancy — detour penalty miles (added miles via best alternate full route)
# Low score = good redundancy. High score = single point of failure.
anchor_0  = 20.0       # minimal detour; strong redundancy
anchor_5  = 120.0      # significant detour; some redundancy
anchor_10 = 350.0      # no viable alternative; full corridor is single POF

[b2]
# Network Centrality — normalized betweenness centrality (max-normalized, P90 per corridor)
# After max-normalization, values range 0.0–1.0 where 1.0 = most central single edge.
# Corridor P90 edge betweenness:
#   Trunk routes (I-80, I-95): typically 0.30–0.70 after max-norm
#   Regional connectors: 0.05–0.30
#   Peripheral spurs: < 0.05
# Anchors calibrated to max-normalized P90 distribution:
# Empirically calibrated from observed corridor P90 betweenness distribution (v1.3):
#   Spine routes (I-80, I-95): P90 ≈ 0.045–0.060  → target B2 = 8–10
#   Regional connectors (I-64, I-70 east): P90 ≈ 0.010–0.020 → target B2 = 3–5
#   Peripheral spurs (I-180, I-380): P90 ≈ 0.001–0.003 → target B2 = 0–1
anchor_0  = 0.0002     # peripheral; essentially no national routing through here
anchor_5  = 0.012      # regional connector; moderate cascade effect
anchor_10 = 0.055      # spine route; failure cascades nationally

[b3]
# Port/Border Access
# Scoring is stepped, not linear; see score_b3() in route-score.
# port_terminus (within 30mi of top-25 port by tonnage) → 10.0
# border_crossing (major US-CA or US-MX crossing) → 8.0
# nearest_top25_port_miles used for continuous scoring otherwise
anchor_0  = 300.0      # >300 miles from any major port/border
anchor_5  = 100.0      # within 100 miles
anchor_10 = 0.0        # port terminus (stepped override)

# ── Band C: People ────────────────────────────────────────────────────────────

[c1]
# Population Reach — total population within 50-mile buffer
anchor_0  = 300_000     # sparsely populated corridor
anchor_5  = 5_000_000   # mid-size metro region
anchor_10 = 25_000_000  # major coastal/urban megaregion

[c2]
# Rural Connectivity — composite of pct_rural_in_buffer + max_rural_interchange_gap_miles
# Scored as: 0.6 * rural_share_score + 0.4 * interchange_gap_score
# Rural share anchors (pct_rural_in_buffer, 0.0–1.0):
[c2.rural_share]
anchor_0  = 0.05        # primarily urban
anchor_5  = 0.45        # mixed urban/rural
anchor_10 = 0.85        # predominantly rural; primary access corridor

# Interchange gap anchors (miles):
[c2.interchange_gap]
anchor_0  = 10.0        # frequent interchange; good rural on-ramp access
anchor_5  = 40.0        # significant gaps; some rural communities underserved
anchor_10 = 100.0       # extreme gaps; corridor passes through but doesn't serve

[c3]
# Economic Opportunity Access — gdp_per_capita_relative (buffer ÷ national)
# Inverted: lower regional GDP/capita → higher opportunity value of connectivity
# gdp_per_capita_relative = 1.0 means equal to national average
#
# IMPORTANT (v1.1 amendment): C3 is DESCRIPTIVE, not causal.
# High C3 score means the corridor serves a region with below-average current GDP per capita.
# It does NOT mean the corridor CAUSED the economic disadvantage or that building it WILL
# cause economic improvement. Correlation with economic gaps is real (r=0.41 in B.1 corpus)
# but causal claims require identification strategies (see Michaels 2008, Chandra 2000).
# Use C3 to identify where coverage gaps and economic gaps co-locate; do not infer causality.
anchor_0  = 1.30        # well above national average; connectivity of limited marginal value
anchor_5  = 0.85        # somewhat below national average
anchor_10 = 0.50        # severely below national average; connectivity has high opportunity value

# ── Band D: Future ────────────────────────────────────────────────────────────

[d1]
# Climate Resilience — v1.3: ECH100-normalized composite
# Both flood and winter closure components converted to:
#   ECH100 = expected annual lane-closure-hours per 100 corridor miles
# before scoring against unified anchors below.
#
# Flood component: ECH100_flood = (consecutive_sfha × p_flood × mean_duration) / (L/100) × μ
#   structural multiplier μ = 5.0 (flood repair takes weeks vs. hours for winter)
# Winter component: ECH100_winter = (closures_per_yr × mean_duration) / (L/100) × δ
#   recovery discount δ = 0.78 (winter closures are recoverable within days)
#
# v1.2 legacy anchors preserved below for forward-only scoring of pre-v1.3 corpus entries:
[d1.consecutive_sfha]
anchor_0  = 0.0         # no flood exposure
anchor_5  = 15.0        # one or two significant river crossings in flood zone
anchor_10 = 60.0        # extended coastal or floodplain exposure; operational risk

# Secondary: fema_sfha_miles total (weighted 0.3 in composite with consecutive above)
[d1.total_sfha]
anchor_0  = 0.0
anchor_5  = 40.0
anchor_10 = 150.0

# v1.3: Unified ECH100 anchor (used when ECH100 data available)
[d1.ech100]
anchor_0  = 0.0          # no closure exposure
anchor_5  = 50.0         # 50 closure-hr/100mi — moderate (Donner ≈ 225, discounted to ~90)
anchor_10 = 200.0        # 200+ closure-hr/100mi — extreme sustained exposure
# Structural multiplier for flood vs winter (applied before scoring):
structural_multiplier_flood  = 5.0   # flood = multi-week repair; much higher effective cost
recovery_discount_winter     = 0.78  # winter = recoverable in hours to days

[d2]
# Multimodal Integration — composite of intermodal_hub_count + dcfc_per_100mi
[d2.intermodal_hubs]
anchor_0  = 0           # no intermodal freight hubs
anchor_5  = 3           # adequate intermodal coverage
anchor_10 = 8           # excellent intermodal integration

[d2.dcfc_per_100mi]
anchor_0  = 0.3         # EV corridor unviable (>33mi avg gap)
anchor_5  = 1.5         # marginal EV viability
anchor_10 = 4.0         # excellent EV corridor (avg gap <25mi)

[d3]
# Infrastructure Vintage — composite of pct_bridges_poor + mean_year_built
[d3.bridges_poor]
anchor_0  = 0.02        # <2% poor condition; well-maintained
anchor_5  = 0.12        # 12% poor; maintenance backlog accumulating
anchor_10 = 0.30        # 30%+ poor; systemic deferred maintenance

[d3.mean_year_built]
anchor_0  = 1995.0      # post-1990 construction; modern standards
anchor_5  = 1970.0      # early-70s; approaching end of design life
anchor_10 = 1955.0      # original Eisenhower-era; significant age risk

# ── A4: International Trade Corridor ──────────────────────────────────────────
[a4]
# USMCA trade corridor designation + border crossing O-D value
# Primary data: FHWA border crossing AADT, USMCA corridor list
# Score 0: No meaningful border crossing traffic served
# Score 5: Serves top-20 US-Mexico or US-Canada border crossing
# Score 10: Serves top-5 crossing (Laredo TX, El Paso TX, San Diego CA/Tijuana, Detroit MI, Blaine WA)
# Note: currently scored from hard-coded USMCA corridor list + geometry proximity
anchor_0  = 0.0
anchor_5  = 5.0    # threshold for "significant" trade corridor designation
anchor_10 = 10.0   # top-5 border crossing corridor

# ── B4: Military/Strategic Designation ────────────────────────────────────────
[b4]
# STRAHNET designation (5.0 base) + major military installation proximity
# Score 0: Not STRAHNET, no major installation within 30 miles
# Score 5: STRAHNET-designated (most T1/T2 corridors)
# Score 8: STRAHNET + serves significant military base
# Score 10: STRAHNET + critical strategic installation (nuclear command, major port)
anchor_0  = 0.0
anchor_5  = 5.0    # STRAHNET baseline
anchor_10 = 10.0   # STRAHNET + highest strategic value

# ── C4: Agricultural Export Access ────────────────────────────────────────────
[c4]
# Agricultural production value in buffer + proximity to export terminals
# Primary export terminals: Houston TX (Gulf), Portland OR/Tacoma WA (Pacific NW),
#   New Orleans LA (Mississippi), Baltimore MD (East Coast)
# Score 0: No significant agricultural production; no export route role
# Score 5: Serves significant ag production; reasonable export terminal access
# Score 10: Primary export corridor for major production zone (Great Plains wheat/beef,
#            Corn Belt, California Central Valley, Pacific NW timber)
anchor_0  = 0.0
anchor_5  = 5.0    # significant agricultural role
anchor_10 = 10.0   # dominant export corridor
