# Relay hub definitions for the I2.0 driver relay network.
# Loaded at runtime by `route hub-staff`.
#
# truck_aadt: HPMS annual average daily traffic on the primary corridor at this hub
# truck_pct:  fraction of AADT that is commercial trucks (from FHWA VTRIS)
# transfer_pct: fraction of trucks that transfer between corridors at this hub
#               (vs. passing through without a driver swap need)
# Sources: HPMS 2018; FHWA VTRIS 2022; ATRI bottleneck data 2024

[[hubs]]
name = "Gary/Chicago, IL"
corridors = ["I-80", "I-90"]
status = "confirmed"
primary_aadt = 85_000
secondary_aadt = 65_000
primary_truck_pct = 12.0
secondary_truck_pct = 12.0
transfer_pct = 100.0   # through-hub node; most trucks swap here
daily_bus_services = 48
avg_leg_miles = 440
notes = "Highest-volume T1/T1 hub nationally; I-80/I-90 merge at Gary IN"

